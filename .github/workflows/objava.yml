# Automatska objava na GitHub Pages.
# Kad se kod pošalje (push) na granu "main", GitHub sam pokrene testove, napravi build
# i objavi folder "dist" na adresu https://<korisnik>.github.io/<ime-repozitorija>/.
# Uključivanje: na GitHubu Settings → Pages → Source: "GitHub Actions".

name: Objava na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.objava.outputs.page_url }}
    steps:
      - id: objava
        uses: actions/deploy-pages@v4
